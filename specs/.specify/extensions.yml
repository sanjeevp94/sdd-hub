installed:
- bdd
- coding-standards-drift-control
- retrospective
- ship
- wiki
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: retrospective
    command: speckit.retrospective.analyze
    enabled: true
    optional: true
    priority: 10
    prompt: Run retrospective analysis now? (spec changes require explicit confirmation)
    description: Offer a retrospective after implementation without modifying spec
      unless approved.
    condition: null
  - extension: coding-standards-drift-control
    command: speckit.coding-standards-drift-control.report
    enabled: true
    optional: true
    priority: 10
    prompt: Run Coding Standards Drift Control after implementation?
    description: Generate or incrementally refresh the coding-standards drift report
      for the active feature
    condition: null
  - extension: wiki
    command: speckit.wiki.ingest
    enabled: true
    optional: true
    priority: 10
    prompt: Record what this implementation taught into the project wiki?
    description: Capture implementation learnings into the wiki after implementation
    condition: null
  - extension: ship
    command: speckit.ship.run
    enabled: true
    optional: true
    priority: 10
    prompt: Ship this feature?
    description: Runs pre-flight checks, syncs branches, generates changelog, and
      creates PR
    condition: null
  after_plan:
  - extension: wiki
    command: speckit.wiki.ingest
    enabled: true
    optional: true
    priority: 10
    prompt: Ingest this feature's research and plan decisions into the project wiki?
    description: Compound the feature's verified research into the wiki after planning
    condition: null
  after_specify:
  - extension: bdd
    command: speckit.bdd.scenarios
    enabled: true
    optional: true
    priority: 10
    prompt: Generate Gherkin acceptance scenarios from the spec before planning?
    description: Converts acceptance criteria into Gherkin feature files immediately
      after spec is written
    condition: null
  before_implement:
  - extension: bdd
    command: speckit.bdd.scaffold
    enabled: true
    optional: true
    priority: 10
    prompt: Scaffold step definition stubs before starting implementation?
    description: Creates step definition stubs so acceptance tests run (and fail)
      before any code is written
    condition: null
